# STEP 2 - Enable the I2C driver
CONFIG_I2C=y
CONFIG_NRFX_SAADC=y
CONFIG_NRFX_GPPI=y
CONFIG_NRFX_TIMER22=y
# STEP 4.2 - Enable floating point format specifiers
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_PM_DEVICE=y
CONFIG_GPIO=y
CONFIG_HWINFO=y
# Use the full C library for math functions
CONFIG_NEWLIB_LIBC=y

# Disable UART Console
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=y
# Enable RTT Console
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
# # Increase buffer size to handle big chunks of data
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="AD8233_EMG"
CONFIG_BT_CTLR_TX_PWR_MINUS_20=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24

# Increase MTU to send ~244 bytes per packet (High Throughput)
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_DATA_LEN_UPDATE=y

# Increase Stack Size for BLE threads
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_PERIOD=8000

CONFIG_BT_NUS=y
CONFIG_SPEED_OPTIMIZATIONS=y
